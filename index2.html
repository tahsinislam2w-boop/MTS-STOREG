<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A24;--surface:#12293A;--text:#E8F1F6;--muted:#93AEBD;--line:#24425A;--brand:#5CC8F0;--brand-text:#06202D;--accent:#FFA52E;--ok:#4FD08E;--err:#FF8A7A;--warn-bg:#3A2D0E;--warn-text:#FFD98A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1A24;--surface:#12293A;--text:#E8F1F6;--muted:#93AEBD;--line:#24425A;--brand:#5CC8F0;--brand-text:#06202D;--accent:#FFA52E;--ok:#4FD08E;--err:#FF8A7A;--warn-bg:#3A2D0E;--warn-text:#FFD98A;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",sans-serif;line-height:1.55;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px}
.demo{background:var(--warn-bg);color:var(--warn-text);text-align:center;font-size:13px;padding:6px 10px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;gap:8px;height:58px}
.logo{font-weight:700;font-size:21px;color:var(--brand);margin-right:auto}

.b{display:inline-block;border:1px solid var(--line);background:none;color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;text-align:center}
.b.p{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.b.big{width:100%;padding:13px;font-size:18px;font-weight:700;border-radius:10px}
.b:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.pkg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.notice{background:var(--brand);color:var(--brand-text);overflow:hidden;white-space:nowrap;font-size:14px;padding:6px 0}
.notice span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.notice span{animation:none;padding-left:14px}}
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px 0 10px;padding-bottom:4px}
.banner{flex:0 0 88%;scroll-snap-align:start;border-radius:14px;padding:22px 18px;min-height:120px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.banner b{font-size:21px;line-height:1.25}
.help{display:flex;gap:8px;margin-bottom:4px}
.help a{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;font-weight:500}
h1{font-size:24px;margin:20px 0 10px}
h2{font-size:20px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}

.tag{font-size:12px;background:var(--accent);color:var(--accent-text);border-radius:99px;padding:1px 9px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border-radius:12px;padding:14px;min-height:92px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,hsl(var(--h) 55% 26%),hsl(var(--h) 60% 38%))}

.tile b{font-weight:600;font-size:15px;line-height:1.3}
.tile:hover{filter:brightness(1.12)}
.cols{display:grid;gap:14px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.live{font-size:12px;color:var(--ok);font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row small{color:var(--muted);display:block}
.ok{color:var(--ok);font-weight:600;white-space:nowrap}
.wait{color:var(--accent);font-weight:600;white-space:nowrap}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bg);font-weight:700;font-size:13px;margin-right:10px}
.row:nth-child(2) .rk{background:var(--accent);color:var(--accent-text)}

.pkg{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;font:inherit;color:inherit}

.pkg span{color:var(--muted);font-size:14px}

label.l{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay label{border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.pay input{width:auto;margin:0}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;margin:16px 0 12px;padding-top:12px;border-top:1px dashed var(--line)}
.err{color:var(--err);font-size:14px;min-height:20px;margin:6px 0 0}
.bal{font-size:34px;font-weight:700;color:var(--brand)}
.back{display:inline-block;margin-top:14px;color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:20px 0}
.empty .b{margin-top:10px}
.lnk{display:block;padding:11px 0;border-top:1px solid var(--line)}
.b,.pkg,.tile,.banner{transition:transform .15s,filter .15s,background .2s,border-color .2s}
.b:active,.pkg:active,.tile:active,.banner:active{transform:scale(.97)}
.tile:hover{transform:translateY(-3px)}
@keyframes pg{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;margin-bottom:-10px}to{opacity:1;margin-bottom:0}}

details.card summary{cursor:pointer;font-weight:600}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}

.acts{display:flex;gap:6px;margin-top:6px}
.info{background:var(--warn-bg);color:var(--warn-text);padding:10px 12px;border-radius:10px;font-size:14px;margin:0 0 10px}

.feat i{font-style:normal;font-size:22px;display:block}
.bell{position:relative}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin:14px 0 0;font-weight:500}
.chk input{width:auto;margin:0}
.lg{width:28px;height:28px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:6px;font-style:normal}
.ti{width:34px;height:34px;object-fit:cover;border-radius:8px;vertical-align:middle}
.tile .ti{width:44px;height:44px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.tabs a{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;background:var(--surface)}
.tabs a.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.bell em{position:absolute;top:-7px;right:-7px;background:var(--err);color:#fff;font-style:normal;font-size:11px;border-radius:99px;padding:0 5px}
@media (min-width:720px){.feat{grid-template-columns:repeat(4,1fr)}}
.num{display:flex;gap:8px;align-items:center}
.num b{flex:1;font-size:22px;letter-spacing:1px;background:var(--bg);border:1px dashed var(--accent);border-radius:8px;padding:8px 12px}
.num input{flex:1;width:auto}
.acc{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-text);display:grid;place-items:center;font-weight:700;flex:none}
footer{margin-top:34px;background:var(--surface);border-top:1px solid var(--line);padding:22px 0;font-size:14px;color:var(--muted)}
footer .g{display:grid;gap:16px}
footer h4{margin:0 0 6px;color:var(--text);font-size:16px}
footer a{display:block;padding:2px 0}
.bn{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.bn a{flex:1;text-align:center;font-size:13px;font-weight:500;padding:4px 0}
.bn a b{display:block;font-size:20px;font-weight:400}
.bn a.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-text);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90%;display:none;text-align:center}
@media (min-width:720px){
 nav.top{display:flex}.bn{display:none}body{padding-bottom:0}#toast{bottom:24px}
 .banner{flex-basis:46%}.tiles{grid-template-columns:repeat(4,1fr)}
 .cols{grid-template-columns:1fr 1fr}footer .g{grid-template-columns:2fr 1fr 1fr 1fr}
 .narrow{max-width:560px;margin:0 auto}
}
</style>
